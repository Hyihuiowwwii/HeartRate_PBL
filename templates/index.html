<!DOCTYPE html>
<html>
<head>
    <title>HeartRate Pro Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">
    <div class="container mt-4">
        <h2>HeartRate Pro: Live Analysis</h2>
        <div class="row mt-4">
            <div class="col-md-7">
                <div class="card bg-secondary">
                    <img src="/video_feed" class="card-img-top">
                    <div class="card-body"><h5 class="text-center">Webcam Feed</h5></div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card bg-secondary p-3">
                    <h4>Live Pulse Signal</h4>
                    <canvas id="pulseChart"></canvas>
                </div>
                <div class="mt-3 p-3 bg-info rounded">
                    <h5>Current BPM: <span id="bpm">--</span></h5>
                    <p>Dataset Validation: UBFC-rPPG Subject 1 Loaded</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

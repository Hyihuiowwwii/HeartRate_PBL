<!DOCTYPE html>
<html>
<head>
    <title>HeartRate Pro - Live Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <div class="row">
            <div class="col-md-8">
                <div class="card bg-secondary shadow">
                    <img src="/video_feed" class="img-fluid rounded">
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light text-dark p-3 mb-3">
                    <h4>Current BPM: <span id="bpm" class="text-primary">--</span></h4>
                </div>
                <div class="card bg-light p-2">
                    <canvas id="liveChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(20).fill(''), datasets: [{ label: 'Pulse Wave', data: [], borderColor: 'rgb(0, 123, 255)', tension: 0.3 }] },
            options: { animation: false }
        });
        setInterval(() => {
            fetch('/get_stats').then(r => r.json()).then(data => {
                document.getElementById('bpm').innerText = data.bpm;
                chart.data.datasets[0].data = data.signal;
                chart.update();
            });
        }, 200);
    </script>
</body>
</html>

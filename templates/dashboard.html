<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HeartRate Pro - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-dark text-white">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-tachometer-alt text-primary"></i> Live Dashboard</h2>
            <a href="/" class="btn btn-outline-light"><i class="fas fa-home"></i> Back Home</a>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card bg-black border-0 shadow-lg">
                    <img src="{{ url_for('video_feed') }}" class="img-fluid rounded-top">
                    <div class="card-footer bg-secondary text-center">
                        <small>Live rPPG Analysis: Keep forehead visible</small>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-secondary border-0 p-3 mb-3 shadow">
                    <h5 class="text-info"><i class="fas fa-heartbeat"></i> Pulse Signal</h5>
                    <canvas id="liveSignalChart" height="250"></canvas>
                </div>
                
                <div class="card bg-primary text-white p-4 text-center shadow mb-3">
                    <h3>Current BPM</h3>
                    <h1 class="display-2 fw-bold" id="bpmDisplay">--</h1>
                </div>

                <div class="p-3 bg-info text-dark rounded shadow-sm">
                    <strong>Status:</strong> Processing Signal...
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('liveSignalChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(30).fill(''),
                datasets: [{
                    label: 'Green Channel Intensity',
                    data: [],
                    borderColor: '#0dcaf0',
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: { animation: false, scales: { y: { display: false }, x: { display: false } } }
        });

        // Fetch BPM and Buffer data from app.py every 200ms
        setInterval(() => {
            fetch('/get_stats').then(response => response.json()).then(data => {
                document.getElementById('bpmDisplay').innerText = data.bpm > 0 ? data.bpm : "--";
                chart.data.datasets[0].data = data.signal;
                chart.update();
            });
        }, 200);
    </script>
</body>
</html>
